# =====================================================================
# tmux config for the CLIENT machine (client machine)
# Install to: ~/.config/tmux/tmux.conf
#
# This server holds local, non-work sessions. Work happens on the remote.
# Prefix is C-b -- the default, and the same as the remote's server.
# Requires tmux 3.4+ (MacPorts ships 3.5a).
# =====================================================================


# --- Prefix ----------------------------------------------------------
# Both machines use C-b, so there is one set of keys to know.
#
# This server is the OUTER one when you attach to the remote from inside a
# local session, so it sees C-b first. send-prefix is what lets you get
# past it: press C-b twice and the second one is forwarded to the remote.
#   C-b   c     new window HERE (on the laptop)
#   C-b C-b c   new window THERE (on the remote)
# F12 below turns this server's keys off if you would rather not count.
set -g prefix C-b
bind C-b send-prefix


# --- Terminal --------------------------------------------------------
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"
set -as terminal-features ",*:clipboard"
set -s escape-time 10
set -g focus-events on
set -g history-limit 50000


# --- Indexing --------------------------------------------------------
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g detach-on-destroy off


# --- Mouse and clipboard ---------------------------------------------
set -g mouse on
set -g set-clipboard on
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi Escape send -X cancel
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"


# =====================================================================
# CLIENT palette -- purple. The remote's server is blue.
# Purple status bar = you are talking to this laptop.
#
#   bg     #2b1f3d   fg      #c3b3d6
#   accent #b47cf0   dim     #3b2b52
# =====================================================================

set -g status on
set -g status-position bottom
set -g status-justify left
set -g status-interval 15
set -g status-style "bg=#2b1f3d,fg=#c3b3d6"
set -g status-left-length 40
set -g status-right-length 60

set -g status-left "#[bg=#b47cf0,fg=#1a1026,bold]  CLIENT #[bg=#3b2b52,fg=#b47cf0]#[bg=#3b2b52,fg=#c3b3d6,bold] #S #[bg=#2b1f3d,fg=#3b2b52]#[default] "
set -g status-right "#[bg=#2b1f3d,fg=#3b2b52]#[bg=#3b2b52,fg=#c3b3d6] #{host_short} #[bg=#3b2b52,fg=#b47cf0]#[bg=#b47cf0,fg=#1a1026,bold] %H:%M "

setw -g window-status-separator ""
setw -g window-status-format "#[bg=#2b1f3d,fg=#9481aa]  #I #W  "
setw -g window-status-current-format "#[bg=#3b2b52,fg=#2b1f3d]#[bg=#3b2b52,fg=#b47cf0,bold] #I #W #[bg=#2b1f3d,fg=#3b2b52]"

set -g pane-border-style "fg=#3b2b52"
set -g pane-active-border-style "fg=#b47cf0"
set -g message-style "bg=#b47cf0,fg=#1a1026,bold"
set -g mode-style "bg=#b47cf0,fg=#1a1026"
set -g display-time 2000


# =====================================================================
# F12 -- hand the whole keyboard to the remote
#
# Both servers answer to C-b, so while you are attached to a remote session
# from inside a local one, this server gets every C-b first. Two ways to reach
# the remote:
#
#   C-b C-b <key>   forward a single prefix through (see send-prefix above)
#   F12             turn this server's keys off for as long as you like
#
# Press F12 once: this server stops reacting to C-b, and the status bar
# goes grey and says "keys off", so plain C-b lands on the remote. Press
# F12 again to take the laptop back.
# =====================================================================

bind -T root F12 \
    set prefix None \;\
    set key-table off \;\
    set status-style "bg=#2e2e33,fg=#8a8a93" \;\
    set status-left "#[bg=#8a8a93,fg=#1c1c1f,bold]  CLIENT keys off #[bg=#3a3a40,fg=#8a8a93]#[bg=#3a3a40,fg=#8a8a93] #S #[bg=#2e2e33,fg=#3a3a40]#[default] " \;\
    set window-status-current-format "#[bg=#3a3a40,fg=#2e2e33]#[bg=#3a3a40,fg=#8a8a93,bold] #I #W #[bg=#2e2e33,fg=#3a3a40]" \;\
    if -F "#{pane_in_mode}" "send -X cancel" \;\
    refresh-client -S

bind -T off F12 \
    set -u prefix \;\
    set -u key-table \;\
    set -u status-style \;\
    set -u status-left \;\
    set -u window-status-current-format \;\
    refresh-client -S


# =====================================================================
# Keybindings -- deliberately identical to the remote's, so the only
# thing you have to remember is which prefix opens them.
# =====================================================================

bind r source-file ~/.config/tmux/tmux.conf \; display "config reloaded"

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

bind c new-window -c "#{pane_current_path}"

bind Left  select-pane -L
bind Down  select-pane -D
bind Up    select-pane -U
bind Right select-pane -R
bind -r S-Left  resize-pane -L 5
bind -r S-Down  resize-pane -D 5
bind -r S-Up    resize-pane -U 5
bind -r S-Right resize-pane -R 5

bind Tab last-window
bind \; last-pane

bind S choose-tree -Zs
bind X confirm-before -p "kill session #S? (y/n)" kill-session

# The picker. On this machine tmx forwards itself to the remote over ssh, so
# this lists REMOTE sessions and dirs and attaches to one.
#
# A new local window rather than a popup, on purpose: the remote session
# lives in this window, and a popup would close and take the session with it.
# One local window per remote session, and C-b C-b reaches the remote.
bind f new-window -n remote-box "$HOME/.local/bin/tmx"

bind ? display-popup -E -w 85% -h 85% "$HOME/.local/bin/tmx help keys"
bind / display-popup -E -w 85% -h 85% "$HOME/.local/bin/tmx help cmds"

bind g display-popup -d "#{pane_current_path}" -E -w 80% -h 70% "$SHELL"
