# =====================================================================
# tmux config for the REMOTE machine (remote machine)
# Install to: ~/.config/tmux/tmux.conf
#
# This is the server that actually holds your work sessions.
# Prefix is C-b -- the default, and the same as the client's server.
# Requires tmux 3.4+ (MacPorts ships 3.5a).
# =====================================================================


# --- Prefix ----------------------------------------------------------
# Both machines use the default C-b, so there is one set of keys to know
# and nothing to retrain.
#
# The cost is that when you attach to this server from inside a tmux
# session on the client, the laptop's tmux sees C-b first. Press it
# TWICE to send it through to this server: C-b C-b c makes a new window
# here rather than there. F12 on the laptop turns its keys off entirely
# if you would rather not double-tap.
set -g prefix C-b
bind C-b send-prefix


# --- Terminal --------------------------------------------------------
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"
set -as terminal-features ",*:clipboard"
set -s escape-time 10
set -g focus-events on
set -g history-limit 50000


# --- Indexing --------------------------------------------------------
# Windows and panes count from 1, matching the number keys' position.
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on


# --- Mirrored attach -------------------------------------------------
# The client and the remote's own screen attach to the SAME session and
# see the same thing. tmux 3.x defaults window-size to "latest", which
# truncates whichever client is not the most recently active. "smallest"
# clamps the window to the smaller of the two terminals, so nothing is
# ever hidden on either screen -- the bigger display just shows padding.
set -g window-size smallest
setw -g aggressive-resize off

# Killing a session drops you into another one rather than to a bare shell.
set -g detach-on-destroy off


# --- Mouse and clipboard ---------------------------------------------
# Scroll, click a pane to focus it, drag a border to resize.
set -g mouse on

# Copies inside this remote tmux are pushed to the client's clipboard
# using OSC 52 escape sequences. iTerm2 must have
#   Settings > General > Selection > "Applications in terminal may access clipboard"
# enabled, otherwise this silently does nothing.
set -g set-clipboard on

setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel
bind -T copy-mode-vi Escape send -X cancel
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel

# --- Big selections: the file bridge ---------------------------------
# OSC 52 is an escape sequence, and escape sequences get truncated once the
# payload is large -- twice over when a local tmux sits in the middle. For
# anything sizeable, Y writes the selection to a file on this machine instead:
#
#   Y here            save the selection to ~/.cache/tmx/clip.txt
#   tmx clip          on the client, pull it onto the local clipboard
#   tmx clip scp      print the raw scp line, if you want the file itself
#
# And the other direction, for pasting something big into a remote pane:
#
#   tmx clip push     on the client, send its clipboard to this machine
#   prefix P here     paste what was pushed
bind -T copy-mode-vi Y send -X copy-pipe-and-cancel "$HOME/.local/bin/tmx clip save"
bind P run-shell -b "tmux load-buffer '$HOME/.cache/tmx/clip.txt' 2>/dev/null && tmux paste-buffer || tmux display-message 'clip: nothing pushed yet -- run tmx clip push on the client'"


# =====================================================================
# REMOTE palette -- blue. The local client server is purple.
# If the status bar is blue, your keystrokes are going to the remote.
#
#   bg     #1b2b40   fg      #a8bccf
#   accent #3d9be9   dim     #243a52
# Colours are written out literally rather than via config variables,
# so this file works on any tmux 3.x without surprises.
# =====================================================================

set -g status on
set -g status-position bottom
set -g status-justify left
set -g status-interval 15
set -g status-style "bg=#1b2b40,fg=#a8bccf"
set -g status-left-length 60
set -g status-right-length 250

# Left: server label, then session name.
set -g status-left "#[bg=#3d9be9,fg=#0b1a29,bold]  REMOTE #[bg=#243a52,fg=#3d9be9]#[bg=#243a52,fg=#a8bccf,bold] #S #[bg=#1b2b40,fg=#243a52]#[default] "

# Right: hostname, dir, branch, worktree flag, last attached, uptime.
# One shell exec every 15s -- see status-interval above.
# Only the session NAME is interpolated here. tmx restricts session names to
# letters, digits, - and _, so nothing in this string can be broken or hijacked
# by a directory name; tmx-status looks the rest up from tmux itself.
set -g status-right "#(exec $HOME/.local/bin/tmx-status right '#{session_name}')"

setw -g window-status-separator ""
setw -g window-status-format "#[bg=#1b2b40,fg=#7f99b2]  #I #W  "
setw -g window-status-current-format "#[bg=#243a52,fg=#1b2b40]#[bg=#243a52,fg=#3d9be9,bold] #I #W #[bg=#1b2b40,fg=#243a52]"
setw -g window-status-activity-style "fg=#3d9be9"

set -g pane-border-style "fg=#243a52"
set -g pane-active-border-style "fg=#3d9be9"
set -g message-style "bg=#3d9be9,fg=#0b1a29,bold"
set -g mode-style "bg=#3d9be9,fg=#0b1a29"
set -g display-time 2000


# =====================================================================
# Keybindings
# =====================================================================

# Reload this file.
bind r source-file ~/.config/tmux/tmux.conf \; display "config reloaded"

# Splits that keep the current directory. | looks like a vertical divider,
# - like a horizontal one, which is what the panes end up looking like.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# New window in the same directory.
bind c new-window -c "#{pane_current_path}"

# Move between panes with the arrow keys, resize with shift+arrows.
bind Left  select-pane -L
bind Down  select-pane -D
bind Up    select-pane -U
bind Right select-pane -R
bind -r S-Left  resize-pane -L 5
bind -r S-Down  resize-pane -D 5
bind -r S-Up    resize-pane -U 5
bind -r S-Right resize-pane -R 5

# Last window / last pane.
bind Tab last-window
bind \; last-pane

# Sessions.
bind S choose-tree -Zs                      # visual session/window tree
bind X confirm-before -p "kill session #S? (y/n)" kill-session

# The fuzzy picker over dirs and sessions.
bind f display-popup -E -w 80% -h 60% "$HOME/.local/bin/tmx"

# Help. Two pages: tmux keys, and the tmx scripts.
bind ? display-popup -E -w 85% -h 85% "$HOME/.local/bin/tmx help keys"
bind / display-popup -E -w 85% -h 85% "$HOME/.local/bin/tmx help cmds"

# Scratch shell in the current directory, same key to open and close.
bind g display-popup -d "#{pane_current_path}" -E -w 80% -h 70% "$SHELL"
